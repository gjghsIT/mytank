name: Init manitto shared store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dorm-manitto/**"
      - ".github/workflows/manitto-store.yml"

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create shared JSON store
        run: |
          set -euo pipefail
          CONFIG="dorm-manitto/store-config.js"
          if grep -q 'https://' "$CONFIG"; then
            echo "Store URL already set"
            exit 0
          fi

          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.request

          body = json.dumps({"version": 0, "lock": None, "matches": []}).encode()
          url = ""

          def post(target, headers=None):
              req = urllib.request.Request(target, data=body, method="POST")
              req.add_header("Content-Type", "application/json")
              req.add_header("Accept", "application/json")
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              return urllib.request.urlopen(req, timeout=20)

          try:
              with post("https://jsonblob.com/api/jsonBlob") as res:
                  url = res.headers.get("Location") or ""
                  blob = res.headers.get("X-jsonblob")
                  if not url and blob:
                      url = f"https://jsonblob.com/api/jsonBlob/{blob}"
          except Exception as error:
              print("jsonblob failed", error)

          if not url:
              try:
                  with post("https://jsonstorage.net/api/items") as res:
                      data = json.load(res)
                      url = data.get("uri") or data.get("url") or ""
              except Exception as error:
                  print("jsonstorage failed", error)

          if not url:
              raise SystemExit("Could not create a shared store")

          print("STORE", url)
          text = f'window.MANITTO_STORE_URL = "{url}";\n'
          pathlib.Path("dorm-manitto/store-config.js").write_text(text, encoding="utf-8")
          korean = pathlib.Path("기숙사마니또")
          if korean.exists():
              (korean / "store-config.js").write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dorm-manitto/store-config.js "기숙사마니또/store-config.js" || true
          git diff --cached --quiet && exit 0
          git commit -m "Add shared manitto store URL."
          git push
